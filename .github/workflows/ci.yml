name: LocalLoop CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: localloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Migrate & Seed Test Database
        working-directory: ./server
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/localloop_test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: localloop_test
          REDIS_URL: redis://localhost:6379
        run: |
          npx tsx src/db/migrate.ts
          npx tsx src/db/seed.ts

      - name: Run Backend Integration Tests
        working-directory: ./server
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/localloop_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci_secret_access_test
          JWT_REFRESH_SECRET: ci_secret_refresh_test
        run: npm test

      - name: Build Backend TypeScript
        working-directory: ./server
        run: npm run build

      - name: Build Frontend React + Vite
        working-directory: ./client
        run: npm run build

